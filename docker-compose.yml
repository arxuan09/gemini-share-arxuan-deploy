# gemini-share-arxuan 部署文件。
# 不需要修改这个文件：所有配置都在同目录的 .env 里（模板见 .env.example）。
# 审计接口（用户中心）部署后在管理台「设置 → 审计接口」配置。
# MySQL / Redis 默认用下面自带的两个容器；要用外部的、不启动自带实例，
# 见 README「使用外部 MySQL / Redis」。

services:
  mysql:
    image: mysql:8.0
    container_name: gemini-share-arxuan-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      # 自带 MySQL 只建 root 账号，密码和库名取 .env 的 MYSQL_PASSWORD / MYSQL_DATABASE。
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-gemini123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gemini}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: gemini-share-arxuan-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # .env 设了 REDIS_PASSWORD 时自带 Redis 开启密码认证。
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'
    volumes:
      - ./data/redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 12

  gemini-share-arxuan:
    image: arxuan09/gemini-share-arxuan:latest
    container_name: gemini-share-arxuan
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LICENSE_KEY: ${LICENSE_KEY:?请先在 .env 里填写 LICENSE_KEY（或运行 ./install.sh）}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GEMINI_GATEWAY_ADDR: 0.0.0.0:19081
      GEMINI_DB_DSN: ${MYSQL_USER:-root}:${MYSQL_PASSWORD:-gemini123}@tcp(${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306})/${MYSQL_DATABASE:-gemini}?charset=utf8mb4&parseTime=true
      GEMINI_REDIS_ADDR: ${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      GEMINI_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      GEMINI_REDIS_DB: ${REDIS_DB:-0}
      # 多实例（一主多副），单实例部署不用管，见 README「多实例部署」。
      NODE_ID: ${NODE_ID:-}
      NODE_ROLE: ${NODE_ROLE:-primary}
      PRIMARY_LOST_TIMEOUT: ${PRIMARY_LOST_TIMEOUT:-}
      REPLICA_REQUIRE_PROXY: ${REPLICA_REQUIRE_PROXY:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${GATEWAY_PORT:-19081}:19081"
    volumes:
      - ./data/gemini-share-arxuan:/data
      - ./list.js:/app/js/list.js:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:19081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
