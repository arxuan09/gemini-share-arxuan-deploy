# gemini-share-arxuan 部署文件。
# 不需要修改这个文件：所有配置都在同目录的 .env 里（模板见 .env.example）。
# 审计接口（用户中心）部署后在管理台「设置 → 审计接口」配置。

services:
  mysql:
    image: mysql:8.0
    container_name: gemini-share-arxuan-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gemini123}
      MYSQL_DATABASE: gemini
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: gemini-share-arxuan-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  gemini-share-arxuan:
    image: arxuan09/gemini-share-arxuan:latest
    container_name: gemini-share-arxuan
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LICENSE_KEY: ${LICENSE_KEY:?请先在 .env 里填写 LICENSE_KEY（或运行 ./install.sh）}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GEMINI_GATEWAY_ADDR: 0.0.0.0:19081
      GEMINI_DB_DSN: root:${MYSQL_ROOT_PASSWORD:-gemini123}@tcp(mysql:3306)/gemini?charset=utf8mb4&parseTime=true
      GEMINI_REDIS_ADDR: redis:6379
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${GATEWAY_PORT:-19081}:19081"
    volumes:
      - ./data/gemini-share-arxuan:/data
      - ./list.js:/app/js/list.js:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:19081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
